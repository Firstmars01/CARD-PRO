<!DOCTYPE html>
<!--
  index.html
  Page unique de Card Pro : onglet « Cartes » (personnes, aperçu, exports)
  et onglet « Modèles » (éditeur recto / verso).
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Politique de sécurité : seuls les fichiers de l'application sont autorisés (anti-XSS). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Crée les cartes de visite de toute l'équipe avec QR code, recto / verso, à partir de modèles personnalisables.">
  <meta name="theme-color" content="#14181f">
  <title>Card Pro · Cartes de visite</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icons/Icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/IconeApple.png">
  <link rel="stylesheet" href="/assets/styles/Themes.css">
  <link rel="stylesheet" href="/assets/styles/Base.css">
  <link rel="stylesheet" href="/assets/styles/Composants.css">
  <link rel="stylesheet" href="/assets/styles/Editeur.css">
  <script type="module" src="/src/Main.js"></script>
</head>
<body>
  <header class="EnTete">
    <img src="/assets/icons/Icone.svg" alt="" width="32" height="32">
    <span class="EnTete-titre">Card Pro <small class="EnTete-version">v4.12.1</small></span>
    <span class="EnTete-sous">Cartes de visite avec QR code</span>
    <nav id="barreOnglets" class="Onglets" role="tablist" aria-label="Sections">
      <button type="button" role="tab" id="tab-cartes" aria-controls="ongletCartes">Cartes</button>
      <button type="button" role="tab" id="tab-modeles" aria-controls="ongletModeles">Modèles</button>
    </nav>
  </header>

  <main class="Application">
    <p id="chargement" class="Aide">Chargement…</p>
    <section id="ongletCartes" class="Panneau" role="tabpanel" aria-labelledby="tab-cartes"></section>
    <section id="ongletModeles" class="Panneau" role="tabpanel" aria-labelledby="tab-modeles" hidden></section>
  </main>

  <div id="notifications" class="Notifications" aria-live="polite"></div>

  <noscript><p class="Avertissement">Card Pro a besoin de JavaScript pour fonctionner.</p></noscript>
</body>
</html>
