# Portefeuille.yml
# Publie l'appli mobile « Card Pro » sur GitHub Pages (HTTPS) :
#  - le portefeuille web (iPhone) et la page « contact » (NFC vers iPhone) ;
#  - la page d'accueil du projet (accueil/, copiée à la racine) ;
#  - la page de téléchargement de l'appli des RH (rh/, l'exe est dans « Releases ») ;
#  - l'appli Android (APK signé, avec le NFC), construite ici.
# Seuls les fichiers nécessaires sont publiés : ni le serveur, ni la page des
# RH, ni aucune donnée de personne.
# Réglages uniques sur GitHub :
#  - Settings → Pages → Source : « GitHub Actions » ;
#  - Settings → Secrets and variables → Actions : les 4 secrets ANDROID_* (voir README).

name: Publier le portefeuille

on:
  push:
    branches: [main]
    paths:
      - "portefeuille/**"
      - "src/**"
      - "assets/**"
      - "contact/**"
      - "rh/**"
      - "accueil/**"
      - "android/**"
      - ".github/workflows/Portefeuille.yml"
  workflow_dispatch:

# Droits minimaux : lecture du code, écriture sur Pages uniquement.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Lancer les tests
        run: npm test

      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Préparer le site
        run: |
          mkdir -p _site/src/Interface _site/assets
          cp -r portefeuille contact rh _site/
          cp -r assets/icons assets/styles assets/polices _site/assets/
          cp -r src/Metier src/Utilitaires _site/src/
          cp -r src/Interface/Rendu src/Interface/Themes.js src/Interface/Notifications.js _site/src/Interface/
          # Lecteur de QR code pour iPhone : jsQR 1.4.0 (licence Apache 2.0), version figée.
          npm pack jsqr@1.4.0 --silent
          tar -xzf jsqr-1.4.0.tgz
          cp package/dist/jsQR.js _site/portefeuille/vendor/jsQR.js
          cp package/LICENSE _site/portefeuille/vendor/jsQR.LICENSE
          # Version du service worker : chaque publication est vue comme une mise à jour par l'appli web.
          sed -i "s/^const VERSION = '.*';/const VERSION = '$(node -p "require('./package.json').version")-${GITHUB_SHA::7}';/" _site/portefeuille/sw.js
          # Adresse publique du site (lien « contact » envoyé par NFC aux iPhone).
          printf "// Généré à la publication : adresse publique du site.\nexport const ADRESSE_SITE = '%s/';\n" "${{ steps.pages.outputs.base_url }}" > _site/portefeuille/src/AdresseSite.js
          # Page d'accueil du projet à la racine du site.
          mkdir -p _site/accueil
          cp accueil/index.html _site/index.html
          cp -r accueil/src accueil/styles _site/accueil/

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Construire l'appli Android (APK signé)
        env:
          CARDPRO_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CARDPRO_KEYSTORE_MOT_DE_PASSE: ${{ secrets.ANDROID_KEYSTORE_MOT_DE_PASSE }}
          CARDPRO_CLE_ALIAS: ${{ secrets.ANDROID_CLE_ALIAS }}
          CARDPRO_CLE_MOT_DE_PASSE: ${{ secrets.ANDROID_CLE_MOT_DE_PASSE }}
        run: |
          if [ -z "$CARDPRO_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant : voir la section « Appli Android » du README."
            exit 1
          fi
          # Clé de signature : écrite le temps de la compilation, puis effacée.
          echo "$CARDPRO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cardpro.jks"
          export CARDPRO_KEYSTORE="$RUNNER_TEMP/cardpro.jks"
          # Numéro de version Android déduit de package.json (4.3.0 → 40300) :
          # une nouvelle version s'installe par-dessus l'ancienne (cartes conservées).
          export CARDPRO_VERSION_NOM="$(node -p "require('./package.json').version")"
          export CARDPRO_VERSION_CODE="$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*10000+b*100+c")"
          # Le portefeuille (déjà préparé pour le site) est copié dans l'appli.
          mkdir -p android/app/src/main/assets/www
          cp -r _site/portefeuille _site/src _site/assets android/app/src/main/assets/www/
          gradle -p android assembleRelease --no-daemon
          rm -f "$RUNNER_TEMP/cardpro.jks"
          mkdir -p _site/telechargement
          cp android/app/build/outputs/apk/release/app-release.apk _site/telechargement/CardPro.apk

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publier
        id: deploiement
        uses: actions/deploy-pages@v4
