<!DOCTYPE html>
<!--
  index.html (accueil)
  Page d'accueil du projet sur GitHub Pages : ce qu'est Card Pro, comment ça
  marche, et le bon téléchargement selon l'appareil (exe du Configurateur sur PC,
  appli mobile sur téléphone). Copiée à la racine du site à la publication :
  les chemins sont relatifs à la racine.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Card Pro : les cartes de visite de toute l'équipe, sur papier et sur téléphone, avec QR code et NFC.">
  <meta name="theme-color" content="#14181f">
  <title>Card Pro · Cartes de visite papier et sur téléphone</title>
  <link rel="icon" href="assets/icons/Icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles/Themes.css">
  <link rel="stylesheet" href="portefeuille/styles/Portefeuille.css">
  <link rel="stylesheet" href="accueil/styles/Accueil.css">
  <script type="module" src="accueil/src/Main.js"></script>
</head>
<body>
  <header id="entete" class="Entete">
    <img src="assets/icons/Icone.svg" alt="" width="30" height="30">
    <h1 class="Entete-titre">Card Pro</h1>
  </header>
  <main id="principal" class="Accueil"></main>
  <footer class="Pied">
    <p id="pied"></p>
  </footer>
  <div id="notifications" class="Notifications" aria-live="polite"></div>
  <noscript><p class="Astuce">Card Pro a besoin de JavaScript.</p></noscript>
</body>
</html>
